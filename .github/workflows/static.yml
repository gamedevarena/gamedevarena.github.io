# Publishes main to the gh-pages branch root, which GitHub Pages serves
# ("Deploy from a branch" in Settings > Pages). Leaves pr-preview/** alone
# so PR preview deploys (see pr-preview.yml) survive a production publish.
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: "pages-main"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      # Rigenera data/site.json (campi events/upcoming) + eventbrite-url.json
      # leggendo events.json (scritto da n8n) e events-legacy.json (statico).
      # Nessun npm install: lo script usa solo moduli nativi di Node.
      # Se un JSON e' malformato lo script esce 1 e il deploy si ferma:
      # il sito online resta quello precedente.
      - name: Build eventi
        run: node scripts/build-events.js
      # Publish only what the site serves: build inputs, dev server and docs
      # stay in the repo. server/livereload.js stays (pages
      # reference it, inert outside localhost).
      - name: Strip non-site files
        run: rm -rf scripts server/server.js package.json package-lock.json README.md AUTOMAZIONE.md events.json events-legacy.json
      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4
        with:
          branch: gh-pages
          folder: '.'
          clean-exclude: |
            pr-preview/
