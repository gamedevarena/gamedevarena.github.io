# Publishes main to the gh-pages branch root, which GitHub Pages serves
# ("Deploy from a branch" in Settings > Pages). Leaves pr-preview/** alone
# so PR preview deploys (see pr-preview.yml) survive a production publish.
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: "pages-main"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Rigenera data/site.json (campi events/upcoming) + eventbrite-url.json
      # leggendo events.json (scritto da n8n) e events-legacy.json (statico).
      # Nessun npm install: lo script usa solo moduli nativi di Node.
      # Se un JSON e' malformato lo script esce 1 e il deploy si ferma:
      # il sito online resta quello precedente.
      - name: Build eventi
        run: node scripts/build-events.js
      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: '.'
          clean-exclude: |
            pr-preview/
